name: Deploy API (Cloudflare)
on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

concurrency: deploy-api
permissions:
  contents: read

jobs:
  deploy:
    # Skipped until the production environment is configured (docs/OPERATIONS.md).
    if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @novamail/api test
      - name: Sync secrets that are not owned by the node
        working-directory: apps/api
        env:
          ENCRYPTION_KEY: ${{ secrets.NOVAMAIL_ENCRYPTION_KEY }}
          OWNER_TOKEN: ${{ secrets.NOVAMAIL_OWNER_TOKEN }}
        run: |
          jq -n --arg e "$ENCRYPTION_KEY" --arg o "$OWNER_TOKEN" '{ENCRYPTION_KEY:$e, OWNER_TOKEN:$o}' > /tmp/s.json
          npx wrangler secret bulk /tmp/s.json && rm /tmp/s.json
      - name: Deploy
        working-directory: apps/api
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/h -w '%{http_code}' https://api.novamail.nexaclouds.online/health) && [ "$code" = 200 ] && cat /tmp/h && exit 0
            sleep 6
          done
          cat /tmp/h; exit 1
