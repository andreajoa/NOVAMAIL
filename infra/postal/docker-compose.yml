# NovaMail sending node: Postal (MTA + send API) + admin sidecar + MariaDB + Caddy.
# Lives at /opt/novamail on the VM; deployed by .github/workflows/deploy-postal.yml.
name: novamail

x-postal: &postal
  image: ghcr.io/postalserver/postal:${POSTAL_VERSION:-3.4.0}
  network_mode: host
  restart: unless-stopped
  volumes:
    - /opt/novamail/postal:/config
  depends_on:
    mariadb:
      condition: service_healthy

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in /opt/novamail/.env}
      MARIADB_DATABASE: postal
    command: ["--bind-address=127.0.0.1", "--max-connections=300", "--innodb-buffer-pool-size=512M"]
    volumes:
      - /opt/novamail/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 30

  web:
    <<: *postal
    command: postal web-server

  smtp:
    <<: *postal
    command: postal smtp-server
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - /opt/novamail/postal:/config
      - /opt/novamail/caddy:/caddy:ro

  # Submission port for customers whose ISP blocks 25 (STARTTLS on 587).
  smtp-submission:
    <<: *postal
    command: postal smtp-server
    cap_add: [NET_BIND_SERVICE]
    environment:
      PORT: "587"
      HEALTH_SERVER_PORT: "9092"
    volumes:
      - /opt/novamail/postal:/config
      - /opt/novamail/caddy:/caddy:ro

  worker:
    <<: *postal
    command: postal worker

  admin:
    <<: *postal
    command: ["bundle", "exec", "rails", "runner", "/novamail-admin/server.rb"]
    environment:
      NOVAMAIL_ADMIN_TOKEN: ${NOVAMAIL_ADMIN_TOKEN:?set in /opt/novamail/.env}
      NOVAMAIL_ADMIN_PORT: "5050"
    volumes:
      - /opt/novamail/postal:/config
      - /opt/novamail/repo/infra/postal/admin:/novamail-admin:ro

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    network_mode: host
    environment:
      POSTAL_HOST: ${POSTAL_HOST:?set in /opt/novamail/.env}
    volumes:
      - /opt/novamail/repo/infra/postal/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/novamail/caddy:/data

  runner:
    <<: *postal
    profiles: ["tools"]
    command: postal
